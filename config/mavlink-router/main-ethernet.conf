# =============================================================================
# mavlink-router — CUAV V6X ETHERNET (USB seri YERİNE) yapılandırması
#
# CANLI DOĞRULANDI 2026-07-27: FC ethernet çalışıyor.
#   FC (CUAV V6X) ethernet: 192.168.2.20:14550, NET_P1_TYPE=2 (UDP Server), MAVLink2.
#   Jetson→.20 ping 0.3ms, MAVLink heartbeat sysid=1 alındı.
# Kurulum:
#   sudo cp main-ethernet.conf /etc/mavlink-router/main.conf
#   sudo systemctl restart mavlink-router
#
# FC NET_ parametreleri (QGC/pymavlink, USB ile bir kereliğine ayarlanmış — mevcut):
#   NET_ENABLE=1, NET_DHCP=0, NET_IPADDR=192.168.2.20, NET_NETMASK=24,
#   NET_GWADDR0=192, NET_P1_TYPE=2 (UDP Server), NET_P1_PORT=14550, NET_P1_PROTOCOL=2.
# NOT: systemd override'daki '/dev/ttyFC bekle' ön-koşulu ethernet için
#      'ping 192.168.2.20 bekle'ye çevrilmelidir (yoksa servis USB yokken başlamaz).
# USB seri (main.conf, /dev/ttyFC) yedek olarak durur; ethernet çökerse geri alınır.
# =============================================================================

[General]
TcpServerPort = 5760
ReportStats = false

# --- FC bağlantısı: SERİ DEĞİL, ETHERNET/UDP ---
# FC UDP *Server* (NET_P1_TYPE=2) → biz ona gideriz → Mode = Normal.
# DİKKAT: mavlink-router satır-içi yorum KABUL ETMEZ; değerlerin yanına # yazma.
# fc: CUAV V6X ethernet statik IP 192.168.2.20 (NET_IPADDR), port 14550 (NET_P1_PORT).
[UdpEndpoint fc]
Mode = Normal
Address = 192.168.2.20
Port = 14550

# --- Aşağıdaki tüketiciler seri config ile AYNI kalır ---
[UdpEndpoint qgc]
Mode = Normal
Address = 192.168.2.1
Port = 14550

[UdpEndpoint ros2bridge]
Mode = Server
Address = 127.0.0.1
Port = 14551

[UdpEndpoint panel]
Mode = Normal
Address = 192.168.2.1
Port = 14552
