# =============================================================================
# mavlink-router — CUAV V6X ETHERNET (USB seri YERİNE) yapılandırması
#
# ŞABLON — FC ethernet IP'si doğrulanmadan CANLIYA BASMA.
# Kurulum (FC ethernet çalıştığı doğrulandıktan SONRA):
#   sudo cp main-ethernet.conf /etc/mavlink-router/main.conf
#   sudo systemctl restart mavlink-router
#
# ÖN KOŞUL (QGC'den, USB ile bir kereliğine ayarlanır):
#   NET_ENABLE=1, NET_DHCP=0, NET_IPADDR=192.168.2.10, NET_NETMASK=24,
#   NET_GWADDR=192.168.2.1, ve bir MAVLink portu (NET_P1_* = UDP, 14550, MAVLink2).
#   FC'ye ping (ping 192.168.2.10) yanıt verince bu config'e geç.
# =============================================================================

[General]
TcpServerPort = 0
ReportStats = false

# --- FC bağlantısı: SERİ DEĞİL, ETHERNET/UDP ---
# FC ArduPilot networking'i UDP *server* ise (FC dinler) → Mode = Normal (biz ona gideriz).
# FC UDP *client* ise (FC bize yollar) → Mode = Server (biz dinleriz). QGC'deki
# NET_P1_TYPE'a göre AŞAĞIDAKİ İKİDEN DOĞRU OLANI aç, diğerini yorumda bırak.

[UdpEndpoint fc]
Mode = Normal
Address = 192.168.2.10     # <-- CUAV V6X ethernet statik IP'si (NET_IPADDR)
Port = 14550               # <-- FC'nin MAVLink UDP portu (NET_P1_PORT)

# --- Alternatif: FC UDP client ise (biz dinleriz) ---
# [UdpEndpoint fc]
# Mode = Server
# Address = 0.0.0.0
# Port = 14550

# --- Aşağıdaki tüketiciler seri config ile AYNI kalır ---
[UdpEndpoint qgc]
Mode = Normal
Address = 192.168.2.1
Port = 14550

[UdpEndpoint ros2bridge]
Mode = Server
Address = 127.0.0.1
Port = 14551

[UdpEndpoint panel]
Mode = Normal
Address = 192.168.2.1
Port = 14552
