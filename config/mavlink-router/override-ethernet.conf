# mavlink-router systemd drop-in — ETHERNET modu ön-koşulu
# Kurulum:
#   sudo cp override-ethernet.conf /etc/systemd/system/mavlink-router.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart mavlink-router
#
# Bu, FC (192.168.2.20) ethernet'te pinglenene kadar servisi bekletir. Eski USB
# sürümü /dev/ttyFC beklerdi (yedek: override.conf.usb-bak). USB'ye dönmek için
# main.conf'u USB sürümüne al + bu dosyayı ttyFC bekleyen eski haline çevir.
# CANLI DOĞRULANDI 2026-07-27: ethernet-only link_ok=True (USB çekiliyken).

[Unit]
StartLimitIntervalSec=0

[Service]
ExecStartPre=/bin/bash -c 'for i in $(seq 1 60); do ping -c1 -W1 192.168.2.20 >/dev/null 2>&1 && exit 0; sleep 1; done; echo "FC .20 60s icinde pinglenemedi"; exit 1'
Restart=always
RestartSec=3
