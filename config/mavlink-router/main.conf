# Jetson uzerindeki mavlink-router yapilandirmasi
# Kurulum: sudo cp main.conf /etc/mavlink-router/main.conf
#          sudo systemctl enable --now mavlink-router
#
# V6X USB -> QGC (14550), ROS koprusu (14551), panel (14552)

[General]
TcpServerPort = 0
ReportStats = false

[UartEndpoint fc]
# udev kurali ile sabitlenmis sembolik ad (scripts/99-auv-serial.rules)
Device = /dev/ttyFC
Baud = 115200

[UdpEndpoint qgc]
Mode = Normal
Address = 192.168.2.1
Port = 14550

[UdpEndpoint ros2bridge]
Mode = Server
Address = 127.0.0.1
Port = 14551

[UdpEndpoint panel]
Mode = Normal
Address = 192.168.2.1
Port = 14552
